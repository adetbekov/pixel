# Pixel — private NAS deployment (Portainer stack `pixel`, endpoint `local`).
#
# The image is built on the NAS from this repo (`docker build -t pixel:latest .`)
# and never pulled, so `pull_policy: never`. No port is published: Nginx Proxy
# Manager reaches the container by name on the shared `npm_network` and
# terminates TLS at https://pixel.yeldos.dev.
#
# SECURITY: the app has no user authentication, and `/api/chat` + `/api/mine`
# both spend GEMINI_API_KEY. The proxy host MUST carry an Access List (HTTP Basic
# or IP allow-list) — that is the real boundary and it is the owner's to add
# (JEB-1514). Since JEB-1623 the app also defends itself where it can:
# TEACHER_DAILY_CAP bounds the daily Gemini spend, CHAT_RATE_LIMIT /
# MINE_RATE_LIMIT bound the per-IP request rate, and MINE_REQUIRE_TOKEN closes
# the one endpoint no visitor needs. None of it authenticates anybody.
services:
  pixel:
    image: pixel:latest
    container_name: pixel
    pull_policy: never
    restart: unless-stopped
    environment:
      TZ: Asia/Almaty
      # Both live on the volume below: the DB (WAL mode, so *.db-wal / *.db-shm
      # appear next to it) and the ~650 MB Laya checkpoint.
      PIXEL_DB_PATH: /data/pixel.db
      HF_HOME: /data/hf
      # Empty key is a supported setup: Pixel starts and runs on Laya alone.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEACHER_MODEL: ${GEMINI_TEACHER_MODEL:-models/gemini-2.5-flash-lite}
      # Not the teacher's model, on purpose: the free-tier quota bucket is per
      # (project, model) and this key is shared with warmplace. Reason in the
      # docstring of backend/miner/generate.py; do not collapse the two.
      GEMINI_MINER_MODEL: ${GEMINI_MINER_MODEL:-models/gemini-3.5-flash}
      LAYA_MODEL: ${LAYA_MODEL:-multilingual}
      LAYA_DEVICE: ${LAYA_DEVICE:-cpu}
      ROUTER_THRESHOLD: ${ROUTER_THRESHOLD:-0.66}
      # 1 = start without Laya (~2 s, /api/chat answers 503). Useful to split a
      # network problem from a weights problem; leave at 0 in normal operation.
      PIXEL_SKIP_MODEL: ${PIXEL_SKIP_MODEL:-0}
      MINER_BATCH: ${MINER_BATCH:-5}
      MINER_SIM: ${MINER_SIM:-0.88}
      MINER_MIN_CLUSTER: ${MINER_MIN_CLUSTER:-3}
      MINER_MIN_MATCH: ${MINER_MIN_MATCH:-0.8}
      # JEB-1623 — the half of the public-access problem the app owns. Defaults
      # must match `backend/teacher/budget.py` and `backend/ratelimit.py`:
      # tests/test_compose_defaults.py compares them, because an unset stack Env
      # makes the value here win over the code (JEB-1602).
      TEACHER_DAILY_CAP: ${TEACHER_DAILY_CAP:-18}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-20}
      MINE_RATE_LIMIT: ${MINE_RATE_LIMIT:-2}
      # Empty = /api/mine stays open. Set it in the stack Env while the proxy
      # host has no Access List; the caller then needs X-Pixel-Admin.
      MINE_REQUIRE_TOKEN: ${MINE_REQUIRE_TOKEN:-}
    volumes:
      - pixel_data:/data
    networks:
      - npm_network
    # mmBERT-base (322M) is resident in the process. 2 GB is the floor; 3 GB
    # leaves room for the first load, which peaks well above the steady state.
    mem_limit: 3g
    healthcheck:
      # No curl in python:3.11-slim — urllib is already there.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/state', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      # A cold start downloads ~650 MB of weights (measured 69 s from nothing,
      # 8-10 s warm). A short start_period reads that as a crash and restarts
      # the container mid-download, forever.
      start_period: 180s

volumes:
  pixel_data:

networks:
  npm_network:
    external: true
