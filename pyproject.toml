[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel"
version = "0.1.0"
description = "Pixel — self-learning robot pet (Laya + Gemini)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    # Pinned: the teacher path is shaped by this SDK's surface — `interactions.create`,
    # `response_format`, `interaction.output_text` — and two call styles already coexist
    # inside 2.x. `tests/test_teacher.py::test_the_sdk_still_has_the_surface_we_call`
    # asserts that surface, so a break fails CI instead of production.
    "google-genai>=2.25,<3",
    "numpy",
]

[project.optional-dependencies]
# The router's brain and its ~200 MB CPU torch wheel. Only the image installs this
# extra (`uv sync --extra engine` in the Dockerfile); `lint + tests` and the live
# contract gate stay torch-free — `backend/brain/engine.py` imports laya lazily, and
# `PIXEL_SKIP_MODEL=1` never reaches it.
engine = [
    # Pinned to a minor: laya is the router's whole brain and its 0.3.x line still
    # moves — the stand and CI were both built on 0.3.11, which the confidence
    # thresholds in `backend/brain/router.py` are calibrated against. An unpinned
    # install lets a 0.4 land on a rebuild of an already-green commit and silently
    # reshape those scores. Bump this line deliberately, re-checking the thresholds.
    "laya>=0.3.10,<0.4",
    # Pinned, and resolved from the `pytorch-cpu` index below (see [tool.uv.sources]):
    # the default PyPI wheel is the CUDA build (~1 GB), and Pixel runs on CPU
    # everywhere. The documented redeploy is `docker build .` on the NAS, so an
    # unpinned torch would rebuild an already-green commit against whatever the
    # index serves that day. CI's `image build` job asserts the built image carries
    # exactly this version and that it is not a CUDA wheel (JEB-1516).
    "torch==2.14.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    # `scripts/assert_required_checks.py` parses .github/workflows/*.yml. PyYAML
    # arrives transitively via uvicorn[standard], but that script and its tests
    # depend on it directly, so it is named here rather than inherited.
    "pyyaml>=6.0",
    # `.github/scripts/verify_image_deps.py` compares the image's versions against
    # the ranges in this file.
    "packaging",
    # Pinned exactly, and equal to the `ruff-pre-commit` rev in
    # .pre-commit-config.yaml: ruff's rule set and formatter output both move
    # between minors (0.16 widened the defaults and turned a locally green PR red
    # in CI). Bump both lines together, fixing the new findings in the same commit.
    "ruff==0.16.10",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# `explicit`: only packages that name this index in [tool.uv.sources] resolve from
# it — everything else stays on PyPI.
explicit = true

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.brain" = ["seed_skills/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit, so a ruff bump cannot widen the rule set under a green PR.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
