[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel"
version = "0.1.0"
description = "Pixel — self-learning robot pet (Laya + Gemini)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "laya",
    # Pinned: the teacher path is shaped by this SDK's surface — `interactions.create`,
    # `response_format`, `interaction.output_text` — and two call styles already coexist
    # inside 2.x. `tests/test_teacher.py::test_the_sdk_still_has_the_surface_we_call`
    # asserts that surface, so a break fails CI instead of production.
    "google-genai>=2.25,<3",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    # Pinned to a minor: `ruff check .` runs with no rule selection, so it uses
    # ruff's *default* rule set — and that set widens between minors. 0.16 added
    # PIE, RET and PLR rules to it, which turned a locally green PR red in CI
    # the moment the unpinned install picked up 0.16.8. Bump this line
    # deliberately, fixing the new findings in the same commit.
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.brain" = ["seed_skills/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
