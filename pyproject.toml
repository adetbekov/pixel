[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel"
version = "0.1.0"
description = "Pixel — self-learning robot pet (Laya + Gemini)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "laya",
    # Pinned: the teacher path is shaped by this SDK's surface — `interactions.create`,
    # `response_format`, `interaction.output_text` — and two call styles already coexist
    # inside 2.x. `tests/test_teacher.py::test_the_sdk_still_has_the_surface_we_call`
    # asserts that surface, so a break fails CI instead of production.
    "google-genai>=2.25,<3",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.brain" = ["seed_skills/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
