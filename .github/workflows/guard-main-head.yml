name: Guard main PR head

# Branch protection on `main` can enforce reviews/status checks but cannot
# restrict which branch a PR's head is. This closes that gap at PR-open time:
# any PR targeting `main` must come from `dev` (the release branch). Feature/
# fix PRs target `dev`; only the deliberate `dev → main` release PR is allowed
# through. See jeb-git-pr / jeb-release.

# BOTH triggers on purpose — transitional dual-trigger phase (JEB-1525).
#
# GitHub resolves `pull_request` from the PR's *merge ref* (head merged into
# base) and `pull_request_target` from the *base* branch. `pull_request_target`
# is the end state the four other studio repos use (JEB-1368), because a head
# cannot rewrite the copy that decides its own gate.
#
# Swapping one key for the other in a single step deadlocks the release that
# would deliver the swap: on the `dev → main` PR neither trigger fires —
# `pull_request` is gone from the merge ref, and `pull_request_target` is not
# on `main` yet. The required context `main PRs must come from dev` would then
# never report, with `strict: true` and `enforce_admins: true` leaving no
# bypass. So both keys ride together until a release carries this copy to
# `main`; the transitional `pull_request` is dropped in its own PR afterwards
# (JEB-1525 step 5). warmplace (#96 → #104) and split-the-bill (#673 → #682)
# migrated exactly this way.
#
# Safe under `pull_request_target` only because this job checks nothing out and
# runs no head-controlled code — never add a checkout step below.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

# Read-only default. The single job reads `github.head_ref` from the event
# payload — it does not even check the repo out.
permissions:
  contents: read

jobs:
  guard-main-head:
    name: main PRs must come from dev
    runs-on: ubuntu-latest
    steps:
      - name: Verify head is dev
        # `github.head_ref` is the bare branch name — a fork's branch named
        # `dev` yields the same value as this repo's release branch. Check the
        # head repository too, so only <this repo>@dev passes.
        # `head.repo.full_name` is null when the fork is gone: empty != this
        # repo, so the guard fails closed.
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::PRs into main must come from ${THIS_REPO}@dev (the release branch). Got ${HEAD_REPO:-<unknown>}@${HEAD_REF}. Feature PRs target dev; see jeb-git-pr / jeb-release."
            exit 1
          fi
          echo "OK: PR into main has head=${THIS_REPO}@dev"
