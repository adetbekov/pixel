name: Guard main PR head

# Branch protection on `main` can enforce reviews/status checks but cannot
# restrict which branch a PR's head is. This closes that gap at PR-open time:
# any PR targeting `main` must come from `dev` (the release branch). Feature/
# fix PRs target `dev`; only the deliberate `dev → main` release PR is allowed
# through. See jeb-git-pr / jeb-release.

# `pull_request_target` only, on purpose (JEB-1368).
#
# GitHub reads `pull_request` from the PR head and `pull_request_target` from
# the base branch. Under `pull_request` the head would control this guard: it
# could rewrite the job to `exit 0`, keep the name, and make the required
# context `main PRs must come from dev` report success on a PR that never came
# from dev. Reading the base copy closes that — the head cannot touch it.
#
# Safe under `pull_request_target` only because this job checks nothing out and
# runs no head-controlled code — never add a checkout step below.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

# Read-only default (JEB-1049). The single job reads `github.head_ref` from the
# event payload — it does not even check the repo out.
permissions:
  contents: read

jobs:
  guard-main-head:
    name: main PRs must come from dev
    runs-on: ubuntu-latest
    steps:
      - name: Verify head is dev
        # `github.head_ref` is the bare branch name — a fork's branch named
        # `dev` yields the same value as this repo's release branch. Check the
        # head repository too, so only <this repo>@dev passes (JEB-1154).
        # `head.repo.full_name` is null when the fork is gone: empty != this
        # repo, so the guard fails closed.
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::PRs into main must come from ${THIS_REPO}@dev (the release branch). Got ${HEAD_REPO:-<unknown>}@${HEAD_REF}. Feature PRs target dev; see jeb-git-pr / jeb-release."
            exit 1
          fi
          echo "OK: PR into main has head=${THIS_REPO}@dev"
