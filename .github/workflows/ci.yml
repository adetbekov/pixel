name: CI

# `check_suite = success` is the hand-off gate for the Multica PR pipeline, so this
# workflow must run on every PR into dev and main.
#
# The `push` trigger is a backstop, not a gate: `pull_request` runs against a
# `base + head` merge commit computed when the run started, so a PR merged after its
# base moved on — or two PRs green on different bases that conflict semantically —
# leaves the branch tip itself untested. Without this, "is the tip of `dev` green?"
# has no answer in the repository at all (step 1 of `jeb-release` needs one).
# Deliberately NOT added to `required_status_checks`: it runs after the merge.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Every job only reads the checkout — nothing pushes, comments on the PR or writes
# packages, and `image build` deliberately never publishes the image it builds.
# Third-party install scripts (`pip install -e`, `npm ci`) run in the same
# environment as GITHUB_TOKEN, so it gets the narrowest scope that still works.
permissions:
  contents: read

# On `pull_request` the PR number groups the run, so a new push to the branch
# supersedes the in-flight one. On `push` `github.event.pull_request` is empty, so
# every push run would otherwise collapse into the single group `ci-` and cancel its
# predecessor — the SHA fallback gives each merged commit its own group, because a
# push run is the only record of whether that commit is green.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # `laya` depends on torch. The default PyPI wheel is the CUDA build (~1 GB);
      # CI only ever needs CPU, so pre-seed the CPU wheel and let the editable
      # install below see the requirement as already satisfied.
      #
      # Same file the Dockerfile installs from — this job is only evidence about the
      # image if both install the same torch, and one file cannot disagree with
      # itself. The `image build` job below checks the image really got it.
      - name: Install CPU torch
        run: pip install -r requirements-torch.txt

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # No model weights are downloaded and no GEMINI_API_KEY is required here —
      # those paths are mocked in tests.
      - name: Tests
        run: pytest -q

  # The nightly live-Gemini gate cannot run on a PR — it needs GEMINI_API_KEY, which
  # a fork PR cannot be given — and its `schedule:` / `workflow_dispatch` triggers
  # only resolve from the default branch. So before JEB-1601 that file had never
  # executed in any form until it executed on `main`, where it died on import: a
  # numpy it never names, four modules down from `backend.miner.case`.
  #
  # This job is the part of it a PR *can* run. It installs exactly what the nightly
  # installs — same `live_contract_requirements.py`, so the two cannot drift — and
  # imports the probe without a key and without a network call. It is not a
  # substitute for the nightly; it only ensures the nightly gets as far as asking.
  #
  # `lint + tests` does not cover this: it installs `.[dev]`, which is a superset,
  # so the nightly's narrower environment is only ever exercised here.
  live-contract-imports:
    name: live gemini contract imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the dependencies the nightly installs
        run: |
          set -euo pipefail
          python .github/scripts/live_contract_requirements.py > live-contract-requirements.txt
          cat live-contract-requirements.txt
          pip install -r live-contract-requirements.txt

      # No GEMINI_API_KEY on purpose: `--check-imports` returns before the key is
      # read, so this stays green on a fork PR and still fails on a missing import.
      - name: Probe imports resolve
        env:
          PYTHONPATH: .
        run: python .github/scripts/check_live_gemini_contract.py --check-imports

  # `frontend/` ships as bare ES modules with no build step, so nothing but this job
  # ever parses it. ESLint is a CI-only devDependency; production stays dependency-free.
  frontend:
    name: frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install lint toolchain
        run: npm ci

      - name: Lint JS
        run: npx eslint frontend

      # JEB-1521: статус отключённого навыка и причина отключения читались на
      # 1.70:1 и 2.18:1 — `opacity` на карточке гасила ровно тот текст, ради
      # которого карточка и нужна. Считать это глазами нельзя: контраст здесь
      # складывается из альфа-заливок и накопленной opacity предков, поэтому
      # гейт открывает страницу в Chromium и меряет вычисленные стили.
      - name: Install Chromium for the contrast gate
        run: npx playwright install --with-deps chromium

      - name: Contrast (WCAG AA)
        run: npm run contrast

      # Fixtures are fetched verbatim by mock.js — a broken one fails only at runtime.
      - name: Validate mock fixtures
        run: |
          shopt -s nullglob
          files=(frontend/mocks/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No fixtures found under frontend/mocks/ — expected at least one." >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            jq empty "$f"
            echo "ok: $f"
          done

  # `Dockerfile` + `docker-compose.yml` are the whole deployment, and the documented
  # redeploy is `docker build .` on the NAS — without this job the first real build of
  # a commit happens on production. The image is built, probed and thrown away: this is
  # a gate, not a deploy, so nothing is pushed to a registry.
  image:
    name: image build
    runs-on: ubuntu-latest
    # One tag for the whole job: the build, both verifiers and the smoke run have to
    # be talking about the same image, and three copies of a literal cannot promise it.
    env:
      IMAGE: pixel:ci
    steps:
      - uses: actions/checkout@v4

      # tomllib needs 3.11+; `packaging` compares the image's laya against the range
      # in pyproject.toml instead of a second copy of that range living in CI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier deps
        run: pip install packaging

      # JEB-1527: both compose steps run before the build — they need no image, take
      # under a second, and a typo in the stack should not cost a full image build to
      # find. `config` parses the YAML, checks it against the compose schema and
      # resolves every `${VAR:-default}`; all of Pixel's have defaults, so nothing is
      # stubbed here and a variable that stops having one fails this step by design.
      - name: docker-compose.yml is valid
        run: docker compose -f docker-compose.yml config -q

      # And that it starts *this* repo's image. A valid stack pulling someone else's
      # tag, or building from another context, passes `config` and then breaks the NAS
      # redeploy — where `pull_policy: never` turns a wrong tag into a silent no-op.
      - name: docker-compose.yml runs the image this job builds
        run: python .github/scripts/verify_compose.py "$IMAGE"

      - uses: docker/setup-buildx-action@v3

      # The torch CPU wheel is ~200 MB and its layer changes only when
      # requirements-torch.txt does, so a code-only PR restores it from cache and
      # rebuilds just the `pip install -e .` layer and the COPYs after it.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # JEB-1516: ci.yml claimed the Dockerfile pinned the same torch while the
      # Dockerfile installed it unpinned, and nothing in CI could tell. This reads the
      # pin from requirements-torch.txt and asks the built image what it actually has.
      - name: Image carries the pinned CPU torch and an in-range laya
        run: python .github/scripts/verify_image_deps.py "$IMAGE"

      # PIXEL_SKIP_MODEL=1 starts in ~2 s and downloads no weights. `/` and `/app.js`
      # are the load-bearing part: an image that lost the frontend — a dropped
      # `COPY frontend/`, a bad .dockerignore — 404s the whole UI silently, with
      # `/api/state` still answering 200 and not one error in the log. (JEB-1530: the
      # `-e` in the Dockerfile is *not* what this catches; a non-editable build serves
      # all three paths fine, because /app/backend shadows site-packages anyway.)
      - name: Smoke-run the image
        run: |
          docker run -d --name pixel-ci -e PIXEL_SKIP_MODEL=1 -p 127.0.0.1:8000:8000 "$IMAGE"
          trap 'docker logs pixel-ci; docker rm -f pixel-ci >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/api/state; then break; fi
            sleep 1
          done

          for path in /api/state / /app.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "GET $path -> $code"
            if [ "$code" != 200 ]; then
              echo "expected 200 from $path" >&2
              exit 1
            fi
          done
